# Full local stack: `docker compose up --build`
# Database only (run the API from your IDE): `docker compose up db`
# Host ports can be changed with DB_PORT and API_PORT (see .env.example).
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: popcorn-palace
      POSTGRES_PASSWORD: popcorn-palace
      POSTGRES_DB: popcorn-palace
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U popcorn-palace -d popcorn-palace"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/popcorn-palace
      DB_USERNAME: popcorn-palace
      DB_PASSWORD: popcorn-palace
      # Development defaults; override them in .env (see .env.example).
      JWT_SECRET: ${JWT_SECRET:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@popcorn.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin-dev-password}
    ports:
      - "${API_PORT:-8080}:8080"

volumes:
  db-data:
