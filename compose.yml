# Full local stack: `docker compose up --build`, then open http://localhost:3000
# Infrastructure only (run the services from your IDE): `docker compose up db redis kafka mailpit jaeger`
# Host ports can be changed in .env (see .env.example).
#
# After booking a seat, open http://localhost:8025 to read the ticket email.
# Watch the stack: Grafana http://localhost:3001, Jaeger (traces) http://localhost:16686,
# Prometheus http://localhost:9090.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: popcorn-palace
      POSTGRES_PASSWORD: popcorn-palace
      POSTGRES_DB: popcorn-palace
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U popcorn-palace -d popcorn-palace"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Holds seats for customers who are checking out and counts login attempts.
  # Nothing here needs to survive a restart, so no volume is attached.
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    # Announce expired keys: that is how a browser learns that a hold ran out.
    command: ["redis-server", "--notify-keyspace-events", "Ex"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Carries booking events from the API to the notifications service.
  # A single node acting as both broker and controller (KRaft, no ZooKeeper).
  kafka:
    image: apache/kafka:4.2.2
    restart: unless-stopped
    ports:
      - "${KAFKA_PORT:-29092}:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Two ways in: "kafka:9092" for the other containers, "localhost:29092" for programs on the host.
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # One broker, so internal topics cannot be replicated.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  # Catches every email the stack sends and shows it at http://localhost:8025.
  # Nothing is delivered to real mailboxes.
  mailpit:
    image: axllent/mailpit:v1.33
    restart: unless-stopped
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
      - "${SMTP_PORT:-1025}:1025"

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/popcorn-palace
      DB_USERNAME: popcorn-palace
      DB_PASSWORD: popcorn-palace
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
      LOG_FORMAT: ${LOG_FORMAT:-}
      # The site as a customer reaches it: links in emails (a password reset) point there.
      SITE_URL: ${SITE_URL:-http://localhost:${WEB_PORT:-3000}}
      # Customers reach the API through the web client, so the address that login
      # attempts are counted by comes from the X-Forwarded-For header it sends.
      FORWARD_HEADERS_STRATEGY: native
      AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-10}
      # Keeps a programme in an empty installation: halls, movies, a week of showtimes.
      DEMO_DATA: ${DEMO_DATA:-true}
      CINEMA_TIME_ZONE: ${CINEMA_TIME_ZONE:-UTC}
      PAYMENT_CURRENCY: ${PAYMENT_CURRENCY:-USD}
      # With a TMDB key the catalog is the films in cinemas now, with posters,
      # descriptions and trailers; without one, a small built-in catalog.
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      TMDB_REGION: ${TMDB_REGION:-US}
      TMDB_LANGUAGE: ${TMDB_LANGUAGE:-en-US}
      # Development defaults; override them in .env (see .env.example).
      JWT_SECRET: ${JWT_SECRET:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@popcorn.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin-dev-password}
    ports:
      - "${API_PORT:-8080}:8080"
    # Port 8081 (health, metrics) stays inside the stack.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 40s

  # The web client: what a customer opens. http://localhost:3000
  # It is the only thing a browser talks to; it calls the API from its server side.
  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_URL: http://api:8080
      CINEMA_TIME_ZONE: ${CINEMA_TIME_ZONE:-UTC}
      CURRENCY: ${PAYMENT_CURRENCY:-USD}
      # This stack is served over plain HTTP. Behind HTTPS, remove this line and
      # the session cookie is sent over HTTPS only.
      SESSION_COOKIE_SECURE: "false"
    ports:
      - "${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Reads booking events from Kafka and emails tickets.
  notifications:
    build: ./notifications
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      # Showtimes in emails are on the clock of the cinema, as on the site.
      NOTIFICATION_TIME_ZONE: ${CINEMA_TIME_ZONE:-UTC}
      OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
      LOG_FORMAT: ${LOG_FORMAT:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 40s

  # Traces: a booking request, its outbox publish, the Kafka message and the
  # email it caused, as one tree. Both services send spans here (OTLP, port 4318
  # inside the stack). http://localhost:16686
  jaeger:
    image: jaegertracing/jaeger:2.23.0
    restart: unless-stopped
    ports:
      - "${JAEGER_PORT:-16686}:16686"

  # Metrics: scrapes both services every 10 seconds (see observability/prometheus.yml). http://localhost:9090
  prometheus:
    image: prom/prometheus:v3.16.0
    restart: unless-stopped
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"

  # The dashboard over those metrics, with Jaeger as a second data source.
  # http://localhost:3001; viewing needs no login, editing needs admin / GRAFANA_PASSWORD.
  grafana:
    image: grafana/grafana:13.3.0
    restart: unless-stopped
    depends_on:
      - prometheus
      - jaeger
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/popcorn-palace.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3001}:3000"

volumes:
  db-data:
