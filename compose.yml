# Full local stack: `docker compose up --build`
# Infrastructure only (run the services from your IDE): `docker compose up db redis kafka mailpit`
# Host ports can be changed in .env (see .env.example).
#
# After booking a seat, open http://localhost:8025 to read the ticket email.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: popcorn-palace
      POSTGRES_PASSWORD: popcorn-palace
      POSTGRES_DB: popcorn-palace
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U popcorn-palace -d popcorn-palace"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Holds seats for customers who are checking out and counts login attempts.
  # Nothing here needs to survive a restart, so no volume is attached.
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Carries booking events from the API to the notifications service.
  # A single node acting as both broker and controller (KRaft, no ZooKeeper).
  kafka:
    image: apache/kafka:4.2.2
    restart: unless-stopped
    ports:
      - "${KAFKA_PORT:-29092}:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Two ways in: "kafka:9092" for the other containers, "localhost:29092" for programs on the host.
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # One broker, so internal topics cannot be replicated.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  # Catches every email the stack sends and shows it at http://localhost:8025.
  # Nothing is delivered to real mailboxes.
  mailpit:
    image: axllent/mailpit:v1.33
    restart: unless-stopped
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
      - "${SMTP_PORT:-1025}:1025"

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/popcorn-palace
      DB_USERNAME: popcorn-palace
      DB_PASSWORD: popcorn-palace
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Development defaults; override them in .env (see .env.example).
      JWT_SECRET: ${JWT_SECRET:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@popcorn.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin-dev-password}
    ports:
      - "${API_PORT:-8080}:8080"

  # Reads booking events from Kafka and emails tickets.
  notifications:
    build: ./notifications
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      MAIL_HOST: mailpit
      MAIL_PORT: 1025

volumes:
  db-data:
