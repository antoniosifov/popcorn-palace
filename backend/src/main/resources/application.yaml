server:
  port: 8080

spring:
  application:
    name: popcorn-palace
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/popcorn-palace}
    username: ${DB_USERNAME:popcorn-palace}
    password: ${DB_PASSWORD:popcorn-palace}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema (see db/migration). Hibernate only verifies
      # at startup that the entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    web:
      pageable:
        max-page-size: 100

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  cors:
    # Browser origins allowed to call the API.
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
  security:
    jwt:
      # HS256 signing key, at least 32 characters. Leave empty to generate a random
      # key at startup (fine for development: tokens stop working after a restart).
      secret: ${JWT_SECRET:}
      # How long an access token stays valid (ISO-8601 duration).
      ttl: ${JWT_TTL:PT1H}
      issuer: popcorn-palace
    admin:
      # Optional administrator account created at startup if it does not exist yet.
      email: ${ADMIN_EMAIL:}
      password: ${ADMIN_PASSWORD:}

logging:
  level:
    # Hibernate logs every constraint violation as an error. Here they are an
    # expected outcome (the loser of a race for a seat or a time slot) and are
    # turned into 409 responses; anything unexpected is logged by ApiExceptionHandler.
    org.hibernate.orm.jdbc.error: "OFF"
