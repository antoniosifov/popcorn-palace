server:
  port: 8080
  # Finish the requests in flight before stopping (a deployment, a restart).
  shutdown: graceful

spring:
  application:
    name: popcorn-palace
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/popcorn-palace}
    username: ${DB_USERNAME:popcorn-palace}
    password: ${DB_PASSWORD:popcorn-palace}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    template:
      # Every message carries the trace it belongs to (W3C traceparent header).
      observation-enabled: true
    producer:
      # Wait for every in-sync replica, and let the broker drop duplicates caused
      # by the producer's own retries, so one send is one message.
      acks: all
      properties:
        enable.idempotence: true
        # Fail within seconds when Kafka is unreachable instead of blocking for
        # the default minute; the outbox relay simply tries again later.
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema (see db/migration). Hibernate only verifies
      # at startup that the entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    web:
      pageable:
        max-page-size: 100
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Fail fast instead of hanging a request when Redis is unreachable.
      timeout: 2s
      connect-timeout: 2s

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  cors:
    # Browser origins allowed to call the API.
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
  holds:
    # How long selected seats stay reserved for a customer before they pay.
    ttl: ${HOLD_TTL:PT10M}
    # Most seats one customer can hold for one showtime.
    max-seats: 8
    # While a hold is being turned into a booking it is kept alive at least this long.
    confirm-grace: PT30S
  events:
    # Kafka topic that booking events (confirmed, cancelled) are published to.
    booking-topic: popcorn.booking-events
  outbox:
    # How often events waiting in the outbox table are sent to Kafka.
    relay-interval: ${OUTBOX_RELAY_INTERVAL:PT0.5S}
    # Most events sent in one go.
    batch-size: 100
    # How long to wait for Kafka to acknowledge a batch before giving up on it.
    send-timeout: PT10S
    # Published events are kept this long, then deleted.
    retention: P7D
    # The outbox reports itself unhealthy when an event has waited longer than this.
    stale-after: PT2M
  seatmap:
    # A browser's live seat stream is closed after this long; the browser reconnects by itself.
    stream-timeout: ${SEATMAP_STREAM_TIMEOUT:PT30M}
    # A comment is sent to every open stream this often, to keep connections alive.
    heartbeat-interval: ${SEATMAP_HEARTBEAT_INTERVAL:PT15S}
  payments:
    # ISO 4217 code of the currency all prices are in.
    currency: ${PAYMENT_CURRENCY:USD}
    # Sandbox provider: how long the tok_slow test token takes.
    slow-delay: PT1S
    # Unfinished payments are looked at this often ...
    reconcile-interval: PT1M
    # ... a PENDING one untouched for this long is abandoned and refunded if it was charged ...
    abandoned-after: PT5M
    # ... and a refund that could not be sent is retried after this long.
    refund-retry-after: PT30S
  rate-limit:
    # Login and registration attempts allowed per client address per window.
    auth:
      max-requests: ${AUTH_RATE_LIMIT:10}
      window: PT1M
  security:
    jwt:
      # HS256 signing key, at least 32 characters. Leave empty to generate a random
      # key at startup (fine for development: tokens stop working after a restart).
      secret: ${JWT_SECRET:}
      # How long an access token stays valid (ISO-8601 duration).
      ttl: ${JWT_TTL:PT1H}
      issuer: popcorn-palace
    admin:
      # Optional administrator account created at startup if it does not exist yet.
      email: ${ADMIN_EMAIL:}
      password: ${ADMIN_PASSWORD:}

management:
  server:
    # Health, info and metrics on their own port, which is not published outside the stack.
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        # Ready to take requests when the database and Redis answer. Kafka being
        # down is survivable (bookings wait in the outbox), so it is reported but not required.
        readiness:
          include: db,redis
  info:
    env:
      enabled: true
  metrics:
    tags:
      # Every metric says which application it comes from (a common tag on every meter).
      application: popcorn-palace
    distribution:
      percentiles-histogram:
        # Buckets, so latency percentiles can be computed in Prometheus across instances.
        "[http.server.requests]": true
  observations:
    enable:
      # One span per request is enough; Spring Security's own span per filter only adds noise.
      "[spring.security]": false
  tracing:
    sampling:
      # Record every trace; lower it when the load is real.
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      otlp:
        enabled: ${TRACING_EXPORT_ENABLED:true}
  opentelemetry:
    tracing:
      export:
        otlp:
          # Where spans go (OTLP over HTTP): Jaeger in the local stack.
          endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  otlp:
    metrics:
      export:
        # Metrics are scraped by Prometheus from /actuator/prometheus, not pushed.
        enabled: false

info:
  app:
    name: Popcorn Palace API
    description: Movie ticket booking API

logging:
  structured:
    format:
      # "ecs" or "logstash" prints one JSON object per line, for log collectors; empty keeps the readable layout.
      console: ${LOG_FORMAT:}
  level:
    # Hibernate logs every constraint violation as an error. Here they are an
    # expected outcome (the loser of a race for a seat or a time slot) and are
    # turned into 409 responses; anything unexpected is logged by ApiExceptionHandler.
    org.hibernate.orm.jdbc.error: "OFF"
