name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the run that is still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: backend/pom.xml

      # Integration tests start PostgreSQL, Redis and Kafka through
      # Testcontainers; the runner already has Docker available.
      - name: Build and test
        run: ./mvnw -B -ntp verify

  notifications:
    name: Notifications build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: notifications
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: notifications/pom.xml

      - name: Build and test
        run: ./mvnw -B -ntp verify

  frontend:
    name: Web client checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      # Unit and component tests: the rules of the seat map and the checkout, without a browser or a server.
      - name: Unit tests
        run: npm test

      # The build needs no API: every page is a shell that is filled at request time.
      - name: Build
        run: npm run build

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build API image
        run: docker build -t popcorn-palace-api ./backend

      - name: Build notifications image
        run: docker build -t popcorn-palace-notifications ./notifications

      - name: Build web client image
        run: docker build -t popcorn-palace-web ./frontend

      # Catches mistakes in compose.yml without starting anything.
      - name: Validate compose file
        run: docker compose config --quiet

      # The same for the stack as a server runs it: compose.yml with its production
      # layer, the web server in front of it, and the scripts that put it there.
      - name: Validate the production layer
        env:
          SITE_HOST: popcorn.example.com
          API_HOST: api.popcorn.example.com
          GRAFANA_HOST: grafana.popcorn.example.com
          TRACES_HOST: traces.popcorn.example.com
          DB_PASSWORD: not-a-secret
          JWT_SECRET: not-a-secret-not-a-secret-not-a-secret
          ADMIN_EMAIL: admin@example.com
          ADMIN_PASSWORD: not-a-secret
          GRAFANA_PASSWORD: not-a-secret
          MAIL_HOST: smtp.example.com
          MAIL_USERNAME: tickets
          MAIL_PASSWORD: not-a-secret
          MAIL_FROM: Popcorn Palace <tickets@example.com>
        run: |
          docker compose -f compose.yml -f compose.prod.yml config --quiet
          docker run --rm -e SITE_HOST -e API_HOST -e GRAFANA_HOST -e TRACES_HOST \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11-alpine caddy validate --config /etc/caddy/Caddyfile
          shellcheck deploy/*.sh

      - name: Validate Prometheus configuration
        run: >
          docker run --rm -v "$PWD/observability/prometheus.yml:/prometheus.yml:ro"
          --entrypoint promtool prom/prometheus:v3.16.0 check config /prometheus.yml

      - name: Validate Grafana dashboard
        run: python3 -m json.tool observability/grafana/dashboards/popcorn-palace.json > /dev/null

      # The READMEs link to each other's sections and to pictures; a renamed heading must not break them.
      - name: Check links in the documentation
        run: python3 .github/scripts/check-doc-links.py

  # A real browser against the whole stack, as docker compose runs it: web
  # client, API, PostgreSQL, Redis, Kafka, the notifications service and the
  # mail catcher. A booking made in the browser has to end as an email.
  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Start the stack
        run: docker compose up -d --build --wait
        env:
          # Every test registers its own customers, all from this one address.
          AUTH_RATE_LIMIT: 1000

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # The browser is the Chrome the runner already has: nothing is downloaded,
      # so the job does not fail when a package mirror cannot be reached.
      - name: Run the tests
        working-directory: frontend
        run: npm run e2e
        env:
          PLAYWRIGHT_CHANNEL: chrome

      - name: Logs of the stack
        if: failure()
        run: docker compose logs --no-color --tail=300 web api notifications

      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
