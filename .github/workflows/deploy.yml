name: Deploy

# Once CI has passed on main: build the three images, publish them to the
# registry of this repository, and release them on the server.
# Also by hand: Actions > Deploy > Run workflow.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One release at a time, and one that has started is never cut short.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  # The commit CI passed on (or, by hand, the newest one on main).
  COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  images:
    name: Publish the ${{ matrix.name }} image
    if: >
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { name: api, context: backend }
          - { name: notifications, context: notifications }
          - { name: web, context: frontend }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.COMMIT }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tagged with the commit, so the server runs exactly what was tested and
      # an older release can be brought back by its commit.
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-${{ matrix.name }}:${{ env.COMMIT }}
            ghcr.io/${{ github.repository }}-${{ matrix.name }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.COMMIT }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  server:
    name: Release on the server
    needs: images
    # Without a server (the DEPLOY_HOST variable of the repository) the images are published and that is all.
    if: vars.DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.SITE_HOST }}
    steps:
      # The key can do one thing on the server: run deploy/deploy.sh with the commit it is given.
      - name: Release
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=yes "deploy@$DEPLOY_HOST" "$COMMIT"

      - name: The site answers
        env:
          SITE_HOST: ${{ vars.SITE_HOST }}
        run: >
          curl --fail --silent --show-error --retry 10 --retry-delay 6 --retry-all-errors
          "https://$SITE_HOST/api/health"
