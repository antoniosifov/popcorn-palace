<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Popcorn Palace</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <ul>
          <li><a href="#movies">🎬 Movies</a></li>
          <li><a href="#showtimes">🕐 Showtimes</a></li>
          <li><a href="#bookings">🎟 Bookings</a></li>
        </ul>
    </nav>
      
  <header>
    <h1>🍿 Popcorn Palace</h1>
  </header>

  <section class="section row fade-in" id="movies">
    <img src="img/photo2.webp" class="section-img" alt="Movies" />
    <div class="section-content">
      <a href="movie.html" class="section-button">🎬 Movies</a>
      <p class="section-desc">View all available movies and their details</p>
    </div>
  </section>

  <section class="section row-reverse fade-in" id="showtimes">
    <img src="img/photo1.webp" class="section-img" alt="Showtimes" />
    <div class="section-content">
      <a href="showtime.html" class="section-button">🕐 Showtimes</a>
      <p class="section-desc">Find out the showtimes and available seats</p>
    </div>
  </section>

  <section class="section row fade-in" id="bookings">
    <img src="img/photo5.webp" class="section-img" alt="Bookings" />
    <div class="section-content">
      <a href="booking.html" class="section-button">🎟 Bookings</a>
      <p class="section-desc">View and manage your bookings</p>
    </div>
  </section>

  <script src="js/movie.js"></script>
</body>
</html>
