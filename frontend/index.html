<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Popcorn Palace movie, showtime, and booking management interface." />
  <title>Popcorn Palace</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet" />
</head>
<body>
  <nav class="navbar" aria-label="Primary navigation">
    <ul>
      <li><a href="#movies">Movies</a></li>
      <li><a href="#showtimes">Showtimes</a></li>
      <li><a href="#bookings">Bookings</a></li>
    </ul>
  </nav>

  <header>
    <h1>Popcorn Palace</h1>
  </header>

  <main>
    <section class="section row fade-in" id="movies">
      <img src="img/photo2.webp" class="section-img" alt="Movie theater seats and screen" />
      <div class="section-content">
        <a href="movie.html" class="section-button">Movies</a>
        <p class="section-desc">Browse and manage the movie catalog</p>
      </div>
    </section>

    <section class="section row-reverse fade-in" id="showtimes">
      <img src="img/photo1.webp" class="section-img" alt="Cinema marquee at night" />
      <div class="section-content">
        <a href="showtime.html" class="section-button">Showtimes</a>
        <p class="section-desc">Create, browse, update, and remove movie showtimes</p>
      </div>
    </section>

    <section class="section row fade-in" id="bookings">
      <img src="img/photo5.webp" class="section-img" alt="Movie tickets and popcorn" />
      <div class="section-content">
        <a href="booking.html" class="section-button">Bookings</a>
        <p class="section-desc">Reserve a seat for an available showtime</p>
      </div>
    </section>
  </main>
</body>
</html>
